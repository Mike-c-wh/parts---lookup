<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Parts Store</title>
<style>
  :root{
    --bg:#15171a; --panel:#1e2125; --panel-2:#24282d;
    --line:#32373d; --text:#eef1f4; --muted:#9aa3ad;
    --accent:#f4a623; --accent-dim:#3a2f17;
    --ok:#46c06a; --low:#f0b429; --out:#e5484d;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 14px 40px;}

  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.3px;margin:0;}
  .brand .sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;}

  .status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
  .dot.live{background:var(--ok);} .dot.cache{background:var(--low);} .dot.err{background:var(--out);}

  .searchbox{position:relative;}
  .searchbox input{
    width:100%;font-size:18px;padding:16px 44px 16px 16px;
    background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);
    color:var(--text);outline:none;font-weight:500;
  }
  .searchbox input:focus{border-color:var(--accent);}
  .searchbox input::placeholder{color:var(--muted);}
  .clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:var(--panel-2);border:none;color:var(--muted);width:30px;height:30px;
    border-radius:50%;font-size:18px;line-height:1;cursor:pointer;display:none;}
  .clearbtn.show{display:flex;align-items:center;justify-content:center;}

  .meta{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;font-size:12px;color:var(--muted);}
  .refresh{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;
    padding:6px 12px;border-radius:20px;cursor:pointer;font-weight:600;}
  .refresh:active{background:var(--panel);}

  .results{display:flex;flex-direction:column;gap:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .pn{font-size:18px;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums;}
  .pn mark{background:var(--accent-dim);color:var(--accent);border-radius:3px;padding:0 1px;}
  .desc{font-size:14px;color:var(--muted);line-height:1.35;}

  .loc{display:flex;align-items:center;gap:8px;background:var(--panel-2);
    border-radius:10px;padding:10px 12px;}
  .loc .lbl{font-size:10px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;font-weight:700;}
  .loc .val{font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;margin-left:auto;}
  .loc .val mark{background:var(--accent-dim);color:#ffd27a;border-radius:3px;padding:0 1px;}

  .stock{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;flex:none;}
  .stock .pill{width:9px;height:9px;border-radius:50%;}
  .stock.ok .pill{background:var(--ok);} .stock.low .pill{background:var(--low);} .stock.out .pill{background:var(--out);}
  .stock.ok{color:var(--ok);} .stock.low{color:var(--low);} .stock.out{color:var(--out);}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .big{font-size:40px;margin-bottom:10px;opacity:.5;}
  .empty p{margin:4px 0;font-size:14px;}

  .banner{background:var(--accent-dim);border:1px solid #5a4a22;color:#ffd27a;
    padding:12px 14px;border-radius:var(--radius);font-size:13px;line-height:1.4;margin-bottom:12px;}
  .banner a{color:#ffd27a;font-weight:700;}

  .config{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;}
  .config h2{font-size:14px;margin:0 0 10px;}
  .config label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .config input{width:100%;font-size:14px;padding:11px 12px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none;margin-bottom:12px;}
  .config input:focus{border-color:var(--accent);}
  .config .btn{background:var(--accent);color:#1a1a1a;border:none;font-weight:700;font-size:14px;
    padding:12px;border-radius:10px;width:100%;cursor:pointer;}
  .config .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px;}
  .gear{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow">
      <div class="brand">
        <h1>Parts Store</h1>
        <span class="sub">Walkers Hammers</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></div>
        <button class="gear" id="gearBtn" title="Settings">⚙</button>
      </div>
    </div>
    <div class="searchbox">
      <input id="search" type="search" inputmode="search" autocomplete="off"
             placeholder="Search part number or description…" enterkeyhint="search">
      <button class="clearbtn" id="clearBtn" aria-label="Clear">×</button>
    </div>
  </header>

  <div id="configPanel" class="config" style="display:none;">
    <h2>Data source</h2>
    <label>Published CSV link (from SharePoint / OneDrive)</label>
    <input id="csvUrl" type="url" placeholder="https://…csv" autocomplete="off">
    <button class="btn" id="saveBtn">Save &amp; refresh</button>
    <p class="hint">Paste the “publish to web as CSV” or “anyone with the link” URL for the parts spreadsheet.
    Expected columns: <b>Part Number</b>, <b>Location</b>, <b>Description</b>, <b>Stock</b> (order doesn’t matter; headers are auto-detected).</p>
  </div>

  <div class="meta">
    <span id="count"></span>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="results" id="results"></div>
</div>

  var $=function(id){return document.getElementById(id);};

      statusText=$("statusText"), dot=$("dot"), clearBtn=$("clearBtn"),

  /* ---------- CSV parsing (handles quotes, commas, newlines) ---------- */
  function parseCSV(text){
    var rows=[], row=[], cur="", q=false, i=0, c, n;
    text=text.replace(/^\uFEFF/,"");
    for(;i<text.length;i++){
      c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
        else cur+=c;
      } else {
        if(c==='"') q=true;
        else if(c===',') {row.push(cur);cur="";}
        else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
        else if(c==='\r'){/*skip*/}
        else cur+=c;
      }
    }
    if(cur.length||row.length){row.push(cur);rows.push(row);}
    return rows.filter(function(r){return r.some(function(v){return v.trim()!=="";});});
  }

  function findCol(headers, names){
    var lower=headers.map(function(h){return h.toLowerCase().trim();});
    for(var k=0;k<names.length;k++){
      for(var j=0;j<lower.length;j++){
        if(lower[j]===names[k]||lower[j].indexOf(names[k])!==-1) return j;
      }
    }
    return -1;
  }

  function mapRows(rows){
    if(!rows.length) return [];
    var h=rows[0];
    var iPN=findCol(h,["part number","part no","partno","part","pn","number","sku"]);
    var iLoc=findCol(h,["location","loc","bin","shelf","position"]);
    var iDesc=findCol(h,["description","desc","name","detail"]);
    var iStock=findCol(h,["stock","qty","quantity","on hand","onhand","count"]);
    if(iPN<0) iPN=0;
    return rows.slice(1).map(function(r){
      return {
        pn:(r[iPN]||"").trim(),
        loc:(iLoc>=0?(r[iLoc]||""):"").trim(),
        desc:(iDesc>=0?(r[iDesc]||""):"").trim(),
        stock:(iStock>=0?(r[iStock]||""):"").trim()
      };
    }).filter(function(p){return p.pn;});
  }

  /* ---------- Status ---------- */
  function setStatus(state, text){
    dot.className="dot"+(state?" "+state:"");
    statusText.textContent=text;
  }
  function timeAgo(ts){
    if(!ts) return "";
    var s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return "just now";
    if(s<3600) return Math.floor(s/60)+" min ago";
    if(s<86400) return Math.floor(s/3600)+" hr ago";
    return Math.floor(s/86400)+" day(s) ago";
  }

  /* ---------- Load ---------- */
  function loadCache(){
    try{
      var d=localStorage.getItem(LS_DATA);
      if(d){ allParts=JSON.parse(d); dataTime=parseInt(localStorage.getItem(LS_TIME),10)||null; return true; }
    }catch(e){}
    return false;
  }

  function fetchData(){
    var url=localStorage.getItem(LS_URL);
    if(!url){ showNeedsConfig(); return; }
    setStatus("","Refreshing…");
    fetch(url,{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(txt){
        var parsed=mapRows(parseCSV(txt));
        if(!parsed.length) throw new Error("No parts found in file");
        allParts=parsed; dataTime=Date.now();
        try{
          localStorage.setItem(LS_DATA,JSON.stringify(allParts));
          localStorage.setItem(LS_TIME,String(dataTime));
        }catch(e){}
        setStatus("live","Live · "+timeAgo(dataTime));
        render(searchEl.value);
      })
      .catch(function(err){
        if(allParts.length){
          setStatus("cache","Offline · cached "+timeAgo(dataTime));
        } else {
          setStatus("err","Can’t load data");
          resultsEl.innerHTML='<div class="empty"><div class="big">⚠</div>'+
            '<p><b>Couldn’t reach the parts file.</b></p>'+
            '<p>'+esc(err.message)+'</p>'+
            '<p style="margin-top:14px;">Check the link in ⚙ settings, or try again on a connection.</p></div>';
        }
      });
  }

  function showNeedsConfig(){
    setStatus("err","No data source");
    configPanel.style.display="block";
    resultsEl.innerHTML='<div class="empty"><div class="big">⚙</div>'+
      '<p><b>Set the data source to begin.</b></p>'+
      '<p>Paste the published CSV link from SharePoint above.</p></div>';
  }

  /* ---------- Render ---------- */
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function highlight(text,q){
    if(!q) return esc(text);
    var t=esc(text);
    var terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean)
      .sort(function(a,b){return b.length-a.length;}); // longest first
    terms.forEach(function(term){
      var eq=esc(term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      t=t.replace(new RegExp("(?![^<]*>)("+eq+")","ig"),"\u0001$1\u0002");
    });
    return t.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
  }

  function stockClass(v){
    var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));
    if(!isNaN(n)){ if(n<=0) return ["out","Out of stock"]; if(n<=3) return ["low",n+" in stock"]; return ["ok",n+" in stock"]; }
    var s=String(v).toLowerCase();
    if(/out|nil|0/.test(s)) return ["out",v||"Out of stock"];
    if(/low/.test(s)) return ["low",v];
    return ["ok",v||"In stock"];
  }

  /* ---------- Search scoring + fuzzy matching ---------- */
  // Levenshtein distance, capped early for speed
  function editDist(a,b){
    var al=a.length, bl=b.length;
    if(Math.abs(al-bl)>2) return 3; // too far apart to be a typo
    var prev=[], cur=[], i, j;
    for(j=0;j<=bl;j++) prev[j]=j;
    for(i=1;i<=al;i++){
      cur[0]=i; var best=i;
      for(j=1;j<=bl;j++){
        var cost=a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
        cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
        if(cur[j]<best) best=cur[j];
      }
      if(best>2) return 3; // whole row already exceeds tolerance
      prev=cur.slice();
    }
    return prev[bl];
  }

  // How well a single search term matches a single haystack word (0 = none)
  function termWordScore(term,word){
    if(word===term) return 6;
    if(word.indexOf(term)===0) return 5;     // prefix
    if(word.indexOf(term)!==-1) return 3;    // contains
    // Fuzzy only for longer, purely-alphabetic words (real words, not codes/locations).
    // Requires the word to be a similar length and within ONE edit — catches genuine
    // typos like "bushng"->"bushing" without sweeping in loosely-similar codes.
    if(term.length>=5 && /^[a-z]+$/.test(term) && /^[a-z]+$/.test(word)
       && Math.abs(word.length-term.length)<=1){
      if(editDist(term,word)===1) return 2;
    }
    return 0;
  }

  // Best score for a term across all words in a field
  function termFieldScore(term,fieldWords,fieldRaw){
    if(fieldRaw.indexOf(term)!==-1) {
      // substring of whole field (catches multi-word spans)
      var base=fieldRaw.indexOf(term)===0?5:3;
      var w=0; for(var k=0;k<fieldWords.length;k++){ var s=termWordScore(term,fieldWords[k]); if(s>w)w=s; }
      return Math.max(base,w);
    }
    var best=0;
    for(var i=0;i<fieldWords.length;i++){ var sc=termWordScore(term,fieldWords[i]); if(sc>best)best=sc; }
    return best;
  }

  function scorePart(p,q,terms){
    var pn=p.pn.toLowerCase(), desc=p.desc.toLowerCase(), loc=(p.loc||"").toLowerCase();
    var pnWords=pn.split(/[^a-z0-9]+/).filter(Boolean);
    var descWords=desc.split(/[^a-z0-9]+/).filter(Boolean);
    var locWords=loc.split(/[^a-z0-9]+/).filter(Boolean);
    var total=0, matchedAll=true;
    for(var t=0;t<terms.length;t++){
      var term=terms[t];
      var pnS=termFieldScore(term,pnWords,pn)*2;   // part number weighted highest
      var dS=termFieldScore(term,descWords,desc);
      var lS=loc?termFieldScore(term,locWords,loc):0; // location lookups (bin codes)
      var termBest=Math.max(pnS,dS,lS);
      if(termBest===0) matchedAll=false;
      total+=termBest;
    }
    if(!matchedAll) return 0;          // every search word must match somewhere
    if(pn.indexOf(q)===0) total+=10;   // strong boost: PN starts with full query
    if(loc && loc===q) total+=6;       // exact location match ranks high
    if(desc.indexOf(q)===0) total+=2;
    return total;
  }

  function render(query){
    query=(query||"").trim();
    var list;
    if(!query){
      list=allParts.slice(0,50);
      countEl.textContent=allParts.length?allParts.length+" parts · type to search":"";
    } else {
      var q=query.toLowerCase();
      var terms=q.split(/\s+/).filter(Boolean);
      list=allParts.map(function(p){
        return {p:p, s:scorePart(p,q,terms)};
      }).filter(function(x){return x.s>0;});
      list.sort(function(a,b){
        if(b.s!==a.s) return b.s-a.s;
        return a.p.pn.length-b.p.pn.length; // shorter PN ties first
      });
      list=list.map(function(x){return x.p;});
      countEl.textContent=list.length+" match"+(list.length===1?"":"es");
    }

    if(!allParts.length){ return; }
    if(!list.length){
      resultsEl.innerHTML='<div class="empty"><div class="big">∅</div>'+
        '<p><b>No parts match “'+esc(query)+'”.</b></p>'+
        '<p>Check the number or try a description word.</p></div>';
      return;
    }

    var html="";
    list.forEach(function(p){
      var sc=stockClass(p.stock);
      html+='<div class="card"><div class="top">'+
        '<div><div class="pn">'+highlight(p.pn,query)+'</div>'+
        (p.desc?'<div class="desc">'+highlight(p.desc,query)+'</div>':'')+'</div>'+
        (p.stock!==""?'<div class="stock '+sc[0]+'"><span class="pill"></span>'+esc(sc[1])+'</div>':'')+
        '</div>'+
        (p.loc?'<div class="loc"><span class="lbl">Location</span>'+
          '<span class="val">'+highlight(p.loc,query)+'</span></div>':'')+
        '</div>';
    });
    if(!query && allParts.length>50){
      html+='<div class="empty" style="padding:24px;"><p>Showing first 50 — search to narrow down.</p></div>';
    }
    resultsEl.innerHTML=html;
  }

  /* ---------- Events ---------- */
  var t;
  searchEl.addEventListener("input",function(){
    clearBtn.classList.toggle("show",!!searchEl.value);
    clearTimeout(t); t=setTimeout(function(){render(searchEl.value);},80);
  });
  clearBtn.addEventListener("click",function(){searchEl.value="";clearBtn.classList.remove("show");render("");searchEl.focus();});
  $("refreshBtn").addEventListener("click",fetchData);
  $("gearBtn").addEventListener("click",function(){
    var open=configPanel.style.display==="block";
    configPanel.style.display=open?"none":"block";
    if(!open) csvUrlEl.value=localStorage.getItem(LS_URL)||"";
  });
  $("saveBtn").addEventListener("click",function(){
    var u=csvUrlEl.value.trim();
    if(!u){return;}
    localStorage.setItem(LS_URL,u);
    configPanel.style.display="none";
    fetchData();
  });

  /* ---------- Init ---------- */
  if(loadCache()){
    setStatus("cache","Cached "+timeAgo(dataTime));
    render("");
  } else if(EMBEDDED_PARTS && EMBEDDED_PARTS.length){
    // Built-in dataset so the app works on first open, before any link is set
    allParts=EMBEDDED_PARTS;
    setStatus("cache","Built-in list · 26 Sep 2026");
    render("");
  }
  // Only try the network if a link has been configured
  if(localStorage.getItem(LS_URL)) fetchData();
})();
</script>
</body>
</html>
